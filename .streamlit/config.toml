[server]
headless = true
maxUploadSize = 80
enableXsrfProtection = true
fileWatcherType = "none"
# Serves ./static at /app/static so the theme can load the local font files.
enableStaticServing = true

[browser]
gatherUsageStats = false

# Bootswatch "Cyborg" (dark); the fonts come from static/theme/bootstrap-w2pdf.css.
[theme]
base = "dark"
primaryColor = "#2A9FD6"
backgroundColor = "#060606"
secondaryBackgroundColor = "#111214"
textColor = "#adafae"
