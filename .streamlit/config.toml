[server]
headless = true
maxUploadSize = 80
enableXsrfProtection = true
fileWatcherType = "none"
# Serves ./static at /app/static so the theme can load the local font files.
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#128C7E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F5"
textColor = "#111827"
